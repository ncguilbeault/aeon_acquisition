[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-acquisition"
version = "0.1.0"
description = "Schema models and code generation for the Project Aeon acquisition framework."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
]

[project.scripts]
aeon-generate = "swc.aeon.schema.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["swc*"]
